name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No setup-go: the runner image already ships a Go newer than the 1.21 go.mod asks for.
      - name: Build
        run: ./build-linux.sh

      - name: Vet and test
        run: cd linux && go vet ./... && go test ./...

      - name: Crypto interop self-test
        run: |
          # The one thing both halves must agree on byte for byte: that Go's GCM
          # reads exactly what CryptoKit wrote. If this fails, every packet would
          # fail authentication at runtime and nothing would work. Run on the
          # binary that ships, not just in the tests.
          ./out/kmlink-linux --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: kmlink-linux
          path: out/kmlink-linux
          if-no-files-found: error

      - name: Publish to the rolling release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Created on first use, so the very first push does not fail for want
          # of a release to upload into. After that only the asset is replaced,
          # which is what keeps the download URL in README.md stable.
          gh release view linux --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create linux --title "kmlink for SteamOS" \
              --notes "Built by CI from main on every push. Only the kmlink-linux asset is replaced; the tag does not move." \
              --repo "$GITHUB_REPOSITORY"
          gh release upload linux out/kmlink-linux --clobber --repo "$GITHUB_REPOSITORY"

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: ./build-mac.sh
      - name: Check it runs
        # build-mac.sh installs to /Applications and removes the local copy on
        # purpose: two bundles sharing one identifier make macOS evaluate the
        # Accessibility grant against the wrong one.
        run: |
          /Applications/kmlink.app/Contents/MacOS/kmlink 2>&1 | grep -q "usage:" && echo "ok"
